name: Windows builds

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-${{ matrix.platform }} -A ${{ matrix.platform }}

      - name: Build
        run: cmake --build build-${{ matrix.platform }} --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Recreate-ModdingStudio-${{ matrix.platform }}
          path: build-${{ matrix.platform }}/bin/Release/HoMM3-Recreate-ModdingStudio.exe
